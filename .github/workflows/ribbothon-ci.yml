name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Test Mini Compiler Bootstrap
        run: |
          cat << 'EOF' > source_mini_compiler.txt
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          
          W $EOF_CHECK x
            C $CHAR $CMP x
            
            F $CMP 43 x
              A $OUT 51 x
              P $OUT x
              Z $OUT x
            U x
            
            C $CHAR $CMP x
            
            F $CMP 45 x
              A $OUT 52 x
              P $OUT x
              Z $OUT x
            U x
            
            I $CHAR x
            C $CHAR $EOF_CHECK x
            A $EOF_CHECK 1 x
          E x
          EOF
          ./meta_compiler < source_mini_compiler.txt > compiled_mini_compiler.rib
          echo -e "\n--- Mini Compiler Execution Result ---"
          echo -n "+--+" | ./ribbothon compiled_mini_compiler.rib
