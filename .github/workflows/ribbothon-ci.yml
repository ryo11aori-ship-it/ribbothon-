name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler7.c -o meta_compiler
          
      - name: Test High-Level Math Abstraction
        run: |
          cat << 'EOF' > source.txt
          Z $VAL_H x
          A $VAL_H 72 x
          P $VAL_H x
          
          A $VAL_H 1 x
          P $VAL_H x
          EOF
          ./meta_compiler < source.txt > compiled.rib
          echo "--- Compiled Ribbon ---"
          cat compiled.rib
          echo -e "\n--- Execution Result ---"
          cat compiled.rib | ./ribbothon
