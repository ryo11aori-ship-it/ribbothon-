name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
      - name: Generate Turing-Complete AOT Compiler (C Transpiler Edition)
        run: |
          cat << 'EOF' > generate.py
          def emit_str(s):
            res = ""
            for c in s:
              res += f"Z $OUT x A $OUT {ord(c)} x P $OUT x\n"
            return res
          with open('source_ultimate_aot.txt', 'w') as f:
            f.write(emit_str("#include <stdio.h>\n#include <stdlib.h>\nunsigned char m[3000000];int p=0;\nint main(){\n"))
            f.write("I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x W $EOF_CHECK x\n")
            f.write("C $CHAR $CMP x F $CMP 49 x\n" + emit_str("p++;\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 50 x\n" + emit_str("p--;\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 51 x\n" + emit_str("m[p]++;\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 52 x\n" + emit_str("m[p]--;\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 53 x\n" + emit_str("putchar(m[p]);\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 54 x\n" + emit_str("m[p]=getchar();\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 55 x\n" + emit_str("while(m[p]){\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 56 x\n" + emit_str("}\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 57 x\n" + emit_str("m[p]+=3;\n") + "U x\n")
            f.write("C $CHAR $CMP x F $CMP 97 x\n" + emit_str("m[p]-=3;\n") + "U x\n")
            f.write("I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x E x\n")
            f.write(emit_str("return 42;\n}\n"))
          EOF
          python3 generate.py
          ./meta_compiler < source_ultimate_aot.txt > ultimate_aot.rib
      - name: Build Self-Hosted Compiler with RTZ Architecture
        run: |
          cat << 'EOF' > generate_self_host.py
          def emit_output(char_code):
            return f"""Z $OUT_CHAR x A $OUT_CHAR {char_code} x P $OUT_CHAR x
          A $COUNT 1 x
          C $COUNT $CMP x F $CMP 5 x Z $OUT_X x A $OUT_X 120 x P $OUT_X x Z $COUNT x U x
          """
          
          res = "Z $COUNT x\nZ $MAIN_LOOP x A $MAIN_LOOP 1 x\nW $MAIN_LOOP x\n"
          res += "I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x C $EOF_CHECK $CMP x F $CMP 0 x Z $MAIN_LOOP x U x\n"
          res += "C $MAIN_LOOP $CMP x F $CMP 1 x\nZ $PROCESSED x\n"
          
          basics = {62:49, 60:50, 43:51, 45:52, 46:53, 44:54, 91:55, 93:56}
          for in_c, out_c in basics.items():
            res += f"C $CHAR $CMP x F $CMP {in_c} x A $PROCESSED 1 x\n" + emit_output(out_c) + "U x\n"
          
          # Z Command (Zero)
          res += "C $CHAR $CMP x F $CMP 90 x A $PROCESSED 1 x I $VAR x\n"
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(49) + "S $TMP 1 x E x\n"
          res += emit_output(55) + emit_output(52) + emit_output(56)
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(50) + "S $TMP 1 x E x\n"
          res += "U x\n"
          
          # A Command (Add 1)
          res += "C $CHAR $CMP x F $CMP 65 x A $PROCESSED 1 x I $VAR x\n"
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(49) + "S $TMP 1 x E x\n"
          res += emit_output(51)
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(50) + "S $TMP 1 x E x\n"
          res += "U x\n"
          
          # S Command (Subtract 1)
          res += "C $CHAR $CMP x F $CMP 83 x A $PROCESSED 1 x I $VAR x\n"
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(49) + "S $TMP 1 x E x\n"
          res += emit_output(52)
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(50) + "S $TMP 1 x E x\n"
          res += "U x\n"
          
          # P Command (Print)
          res += "C $CHAR $CMP x F $CMP 80 x A $PROCESSED 1 x I $VAR x\n"
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(49) + "S $TMP 1 x E x\n"
          res += emit_output(53)
          res += "C $VAR $TMP x W $TMP x\n" + emit_output(50) + "S $TMP 1 x E x\n"
          res += "U x\n"
          
          res += "U x\nE x\n"
          
          res += "Z $PAD_LOOP x\n"
          res += "C $COUNT $CMP x F $CMP 1 x A $PAD_LOOP 1 x U x\n"
          res += "C $COUNT $CMP x F $CMP 2 x A $PAD_LOOP 1 x U x\n"
          res += "C $COUNT $CMP x F $CMP 3 x A $PAD_LOOP 1 x U x\n"
          res += "C $COUNT $CMP x F $CMP 4 x A $PAD_LOOP 1 x U x\n"
          res += "W $PAD_LOOP x\n"
          res += "Z $OUT_ZERO x A $OUT_ZERO 48 x P $OUT_ZERO x\n"
          res += "A $COUNT 1 x\n"
          res += "C $COUNT $CMP x F $CMP 5 x Z $OUT_X x A $OUT_X 120 x P $OUT_X x Z $COUNT x Z $PAD_LOOP x U x\n"
          res += "E x\n"
          
          with open('source_self_host_compiler.txt', 'w') as f:
            f.write(res)
          EOF
          python3 generate_self_host.py
          ./meta_compiler < source_self_host_compiler.txt > self_host_compiler.rib
          cat self_host_compiler.rib | ./ribbothon ultimate_aot.rib > self_host_compiler.c
          gcc -O3 self_host_compiler.c -o self_host_compiler.exe
          chmod +x self_host_compiler.exe
          
          echo -e "\n--- Executing Self-Hosted Compiler (Z A P Test) ---"
          set +e
          echo -n "Z!A!P!" | ./self_host_compiler.exe > test_output.txt
          RET=$?
          set -e
          echo "Status: $RET"
          echo -e "\n--- Test Output ---"
          cat test_output.txt
