      - name: Verify Strict Ultimate Pure Self-Host Fixed-Point
        run: |
          cat << 'EOF' > build_compilers.py
          import sys
          def bf_to_rib(bf_code):
           m = {">":"1", "<":"2", "+":"3", "-":"4", ".":"5", ",":"6", "[":"7", "]":"8"}
           rib = "".join([m[c] for c in bf_code if c in m])
           f_out = "".join([x+"x" if (i+1)%5==0 else x for i, x in enumerate(rib)])
           if len(rib)%5!=0: f_out += "x"
           return f_out
          
          bf1 = ">>,+[-"
          mappings = {62:49, 60:50, 43:51, 45:52, 46:53, 44:54, 91:55, 93:56}
          for target, out in mappings.items():
           bf1 += "[->+>+<<]>>[-<<+>>]<" + "-"*target + ">+<[>[-]<[-]]>["
           bf1 += ">" + "+"*out + ".[-]<<<<+>>>>"
           bf1 += "<<<<[->>>>+>+<<<<<]>>>>>[-<<<<<+>>>>>]<"
           bf1 += "-----" + ">+<[>[-]<[-]]>["
           bf1 += ">" + "+"*120 + ".[-]<<<<<<[-]>>>>>[-]]<<[-]]<<"
          bf1 += "[-],+]"
          with open("rib_compiler.bf", "w") as f: f.write(bf1)
          with open("rib_compiler.rib", "w") as f: f.write(bf_to_rib(bf1))
          
          asm = """
          [org 0x7C00]
          jmp entry
          times 0x40-($-$$) db 0
          out_char:
              mov al, [es:di]
              mov [fs:bp], al
              inc bp
              ret
          times 0x50-($-$$) db 0
          in_char:
              mov dx, 0x3fd
          .wait:
              in al, dx
              test al, 1
              jz .wait
              mov dx, 0x3f8
              in al, dx
              mov [es:di], al
              ret
          times 0x70-($-$$) db 0
          jump_fwd:
              cmp byte [es:di], 0
              jnz .done
              pop si
              mov dx, 1
          .loop:
              cmp word [si], 0xA0B8
              jne .not_close
              dec dx
              jz .found
              jmp .next
          .not_close:
              cmp word [si], 0x70B8
              jne .next
              inc dx
          .next:
              add si, 5
              jmp .loop
          .found:
              add si, 5
              push si
          .done:
              ret
          times 0xA0-($-$$) db 0
          jump_bwd:
              cmp byte [es:di], 0
              jz .done2
              pop si
              sub si, 10
              mov dx, 1
          .loop2:
              cmp word [si], 0x70B8
              jne .not_open
              dec dx
              jz .found2
              jmp .next2
          .not_open:
              cmp word [si], 0xA0B8
              jne .next2
              inc dx
          .next2:
              sub si, 5
              jmp .loop2
          .found2:
              add si, 5
              push si
          .done2:
              ret
          times 0xD0-($-$$) db 0
          dap:
              db 0x10, 0
              dw 127
              dw 0x7E00, 0x0000
              dq 1
          entry:
              xor ax, ax
              mov ds, ax
              mov ss, ax
              mov sp, 0x7C00
              mov ah, 0x42
              mov si, dap
              int 0x13
              mov ax, 0x3000
              mov es, ax
              xor di, di
              mov cx, 0x8000
              xor ax, ax
              rep stosw
              mov ax, 0x2000
              mov es, ax
              xor di, di
              mov cx, 0x8000
              xor ax, ax
              rep stosw
              mov ax, 0x3000
              mov fs, ax
              xor bp, bp
              jmp 0x7E00
          times 510-($-$$) db 0
          dw 0xaa55
          """
          with open("runtime.asm", "w") as f: f.write(asm)
          import subprocess
          subprocess.run(["nasm", "-f", "bin", "runtime.asm", "-o", "runtime.bin"], check=True)
          with open("runtime.bin", "rb") as f: runtime = f.read()
          def emit_byte(b):
           if b==0: return "[-]."
           if b<=15: return "[-]"+"+"*b+"."
           q, r = divmod(b, 10)
           return "[-]>[-]++++++++++[<"+"+"*q+">-]<"+"+"*r+"."
          bf2 = ""
          for b in runtime: bf2 += emit_byte(b)
          bf2 += ">>,+[-"
          targets = {
           49: [0x47, 0x90, 0x90, 0x90, 0x90],
           50: [0x4F, 0x90, 0x90, 0x90, 0x90],
           51: [0x26, 0xFE, 0x05, 0x90, 0x90],
           52: [0x26, 0xFE, 0x0D, 0x90, 0x90],
           53: [0xB8, 0x40, 0x7C, 0xFF, 0xD0],
           54: [0xB8, 0x50, 0x7C, 0xFF, 0xD0],
           55: [0xB8, 0x70, 0x7C, 0xFF, 0xD0],
           56: [0xB8, 0xA0, 0x7C, 0xFF, 0xD0]
          }
          for t, block in targets.items():
           bf2 += "[->+>+<<]>>[-<<+>>]<" + "-"*t + ">+<[>[-]<[-]]>["
           for b in block: bf2 += ">" + emit_byte(b) + "<"
           bf2 += "[-]]<<"
          bf2 += "[-],+]"
          bf2 += ">" + emit_byte(0xFA) + "<" # cli
          bf2 += ">" + emit_byte(0xF4) + "<" # hlt
          with open("aot_compiler.rib", "w") as f: f.write(bf_to_rib(bf2))
          EOF
          python3 build_compilers.py
          
          echo "=== Phase 1: Source-Level Self-Host (Language Reconstruction) ==="
          ./ribbothon rib_compiler.rib < rib_compiler.bf > c1.rib
          ./ribbothon c1.rib < rib_compiler.bf > c2.rib
          if ! cmp -s c1.rib c2.rib; then echo "FAIL: self-host fixed point failed"; exit 1; fi
          echo "SUCCESS: Source-Level Fixed Point Achieved!"
          
          echo "=== Phase 2: Native-Level Self-Host (AOT Execution) ==="
          ./ribbothon aot_compiler.rib < aot_compiler.rib > gen1.img
          truncate -s 65536 gen1.img
          cat << 'EOF' > run_qemu.py
          import sys,time,subprocess,socket
          i=sys.argv[1]; o=sys.argv[2]
          p=subprocess.Popen(["qemu-system-x86_64","-drive",f"format=raw,file={i}","-display","none","-monitor","tcp:127.0.0.1:14444,server,nowait","-serial","stdio"],stdin=subprocess.PIPE,stdout=subprocess.DEVNULL)
          with open("aot_compiler.rib","rb") as f_in:
           p.stdin.write(f_in.read())
           p.stdin.write(b"\xff")
           p.stdin.flush()
          time.sleep(8)
          s=socket.socket(); s.connect(("127.0.0.1",14444))
          s.sendall(b"pmemsave 0x30000 65536 memdump.bin\nquit\n")
          p.wait()
          with open("memdump.bin","rb") as f: data=f.read()
          with open(o,"wb") as f: f.write(data)
          EOF
          python3 run_qemu.py gen1.img gen2.img
          python3 run_qemu.py gen2.img gen3.img
          H2=$(sha256sum gen2.img | awk '{print $1}')
          H3=$(sha256sum gen3.img | awk '{print $1}')
          EMPTY="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          echo "Gen 2: $H2"
          echo "Gen 3: $H3"
          if [ "$H2" = "$EMPTY" ] || [ "$H3" = "$EMPTY" ]; then echo "FAIL: Output is empty!"; exit 1; fi
          if [ "$H2" != "$H3" ]; then echo "FAIL: Native fixed-point failed!"; exit 1; fi
          echo "SUCCESS: Strict absolute self-hosting achieved across all dimensions."
