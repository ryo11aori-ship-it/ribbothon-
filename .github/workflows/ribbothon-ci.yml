name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Build I/O Native Compiler (Rock Solid Pointers)
        run: |
          cat << 'EOF' > source_ultimate_aot.txt
          Z $OUT x
          A $OUT 127 x P $OUT x Z $OUT x
          A $OUT 69 x P $OUT x Z $OUT x
          A $OUT 76 x P $OUT x Z $OUT x
          A $OUT 70 x P $OUT x Z $OUT x
          A $OUT 2 x P $OUT x Z $OUT x
          A $OUT 1 x P $OUT x Z $OUT x
          A $OUT 1 x P $OUT x Z $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 2 x P $OUT x Z $OUT x P $OUT x
          A $OUT 62 x P $OUT x Z $OUT x P $OUT x
          A $OUT 1 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 120 x P $OUT x Z $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x
          A $OUT 56 x P $OUT x Z $OUT x P $OUT x
          A $OUT 1 x P $OUT x Z $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 1 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 7 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x A $OUT 16 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x A $OUT 16 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x A $OUT 16 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          
          Z $OUT x
          A $OUT 73 x P $OUT x Z $OUT x A $OUT 191 x P $OUT x Z $OUT x P $OUT x A $OUT 8 x P $OUT x Z $OUT x A $OUT 64 x P $OUT x Z $OUT x P $OUT x
          A $OUT 77 x P $OUT x Z $OUT x A $OUT 49 x P $OUT x Z $OUT x A $OUT 246 x P $OUT x Z $OUT x
          
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          W $EOF_CHECK x
          C $CHAR $CMP x
          F $CMP 49 x
          A $OUT 73 x P $OUT x Z $OUT x A $OUT 255 x P $OUT x Z $OUT x A $OUT 198 x P $OUT x Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 50 x
          A $OUT 73 x P $OUT x Z $OUT x A $OUT 255 x P $OUT x Z $OUT x A $OUT 206 x P $OUT x Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 51 x
          A $OUT 66 x P $OUT x Z $OUT x A $OUT 254 x P $OUT x Z $OUT x A $OUT 4 x P $OUT x Z $OUT x A $OUT 55 x P $OUT x Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 52 x
          A $OUT 66 x P $OUT x Z $OUT x A $OUT 254 x P $OUT x Z $OUT x A $OUT 12 x P $OUT x Z $OUT x A $OUT 55 x P $OUT x Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 53 x
          A $OUT 176 x P $OUT x Z $OUT x A $OUT 1 x P $OUT x Z $OUT x A $OUT 191 x P $OUT x Z $OUT x A $OUT 1 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x A $OUT 76 x P $OUT x Z $OUT x A $OUT 137 x P $OUT x Z $OUT x A $OUT 254 x P $OUT x Z $OUT x A $OUT 76 x P $OUT x Z $OUT x A $OUT 1 x P $OUT x Z $OUT x A $OUT 246 x P $OUT x Z $OUT x A $OUT 178 x P $OUT x Z $OUT x A $OUT 1 x P $OUT x Z $OUT x A $OUT 15 x P $OUT x Z $OUT x A $OUT 5 x P $OUT x Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 54 x
          A $OUT 48 x P $OUT x Z $OUT x A $OUT 192 x P $OUT x Z $OUT x A $OUT 49 x P $OUT x Z $OUT x A $OUT 255 x P $OUT x Z $OUT x A $OUT 76 x P $OUT x Z $OUT x A $OUT 137 x P $OUT x Z $OUT x A $OUT 254 x P $OUT x Z $OUT x A $OUT 76 x P $OUT x Z $OUT x A $OUT 1 x P $OUT x Z $OUT x A $OUT 246 x P $OUT x Z $OUT x A $OUT 178 x P $OUT x Z $OUT x A $OUT 1 x P $OUT x Z $OUT x A $OUT 15 x P $OUT x Z $OUT x A $OUT 5 x P $OUT x Z $OUT x
          U x
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          E x
          
          A $OUT 184 x P $OUT x Z $OUT x A $OUT 60 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 191 x P $OUT x Z $OUT x A $OUT 42 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 15 x P $OUT x Z $OUT x A $OUT 5 x P $OUT x Z $OUT x
          EOF
          ./meta_compiler < source_ultimate_aot.txt > ultimate_aot.rib
          
          echo -e "\n--- Step 1: Writing pure Ribbothon ECHO program '65' (,.) ---"
          echo -n "65" > my_app.rib
          
          echo -e "\n--- Step 2: Compiling 'my_app.rib' to Native Linux Executable ---"
          cat my_app.rib | ./ribbothon ultimate_aot.rib > my_app.exe
          
          echo -e "\n--- Step 3: Executing Native Executable (Feeding 'R' as Input) ---"
          chmod +x my_app.exe
          
          # GitHub Actionsがエラー42で止まらないようにエラーハンドリングを一時解除
          set +e
          echo -n "R" | ./my_app.exe > result.txt
          RET=$?
          set -e
          
          echo -e "\n--- Output from Native Executable ---"
          cat result.txt
          echo ""
          
          echo -e "\n--- OS Return Code (Expected 42) ---"
          echo "Status: $RET"
