name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Generate Turing-Complete AOT Compiler (C Transpiler Edition)
        run: |
          cat << 'EOF' > generate.py
          def emit_str(s):
              res = ""
              for c in s:
                  res += f"Z $OUT x A $OUT {ord(c)} x P $OUT x\n"
              return res
          
          with open('source_ultimate_aot.txt', 'w') as f:
              f.write(emit_str("#include <stdio.h>\n#include <stdlib.h>\nunsigned char m[3000000];int p=0;\nint main(){\n"))
              f.write("I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x W $EOF_CHECK x\n")
              f.write("C $CHAR $CMP x F $CMP 49 x\n" + emit_str("p++;\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 50 x\n" + emit_str("p--;\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 51 x\n" + emit_str("m[p]++;\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 52 x\n" + emit_str("m[p]--;\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 53 x\n" + emit_str("putchar(m[p]);\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 54 x\n" + emit_str("m[p]=getchar();\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 55 x\n" + emit_str("while(m[p]){\n") + "U x\n")
              f.write("C $CHAR $CMP x F $CMP 56 x\n" + emit_str("}\n") + "U x\n")
              f.write("I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x E x\n")
              f.write(emit_str("return 42;\n}\n"))
          EOF
          python3 generate.py
          ./meta_compiler < source_ultimate_aot.txt > ultimate_aot.rib
          
          echo -e "\n--- Step 1: Writing pure Ribbothon Loop Program 'A' ---"
          echo -n "3333337133333333332481333335" > my_app.rib
          
          echo -e "\n--- Step 2: Compiling 'my_app.rib' to Native Linux Executable ---"
          cat my_app.rib | ./ribbothon ultimate_aot.rib > my_app.c
          gcc -O3 my_app.c -o my_app.exe
          
          echo -e "\n--- Step 3: Executing the Native Turing-Complete Executable! ---"
          chmod +x my_app.exe
          set +e
          ./my_app.exe > result.txt
          RET=$?
          set -e
          echo -e "\n--- OS Return Code (Expected 42) ---"
          echo "Status: $RET"
          
      - name: Test Self-Hosting Foundation
        run: |
          cat << 'EOF' > source_self_host_compiler.txt
          Z $COUNT x
          Z $MAIN_LOOP x
          A $MAIN_LOOP 1 x
          W $MAIN_LOOP x
          Z $CHAR x
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          C $EOF_CHECK $CMP x
          F $CMP 0 x
          Z $MAIN_LOOP x
          U x
          C $MAIN_LOOP $CMP x
          F $CMP 1 x
          Z $PROCESSED x
          Z $OUT_CHAR x
          C $CHAR $CMP x F $CMP 62 x A $OUT_CHAR 49 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 60 x A $OUT_CHAR 50 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 43 x A $OUT_CHAR 51 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 45 x A $OUT_CHAR 52 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 46 x A $OUT_CHAR 53 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 44 x A $OUT_CHAR 54 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 91 x A $OUT_CHAR 55 x A $PROCESSED 1 x U x
          C $CHAR $CMP x F $CMP 93 x A $OUT_CHAR 56 x A $PROCESSED 1 x U x
          C $PROCESSED $CMP x F $CMP 1 x
          P $OUT_CHAR x
          A $COUNT 1 x
          C $COUNT $CMP x F $CMP 5 x
          Z $OUT_X x A $OUT_X 120 x P $OUT_X x
          Z $COUNT x
          U x
          U x
          U x
          E x
          Z $PAD_LOOP x
          C $COUNT $CMP x
          F $CMP 1 x A $PAD_LOOP 1 x U x
          F $CMP 2 x A $PAD_LOOP 1 x U x
          F $CMP 3 x A $PAD_LOOP 1 x U x
          F $CMP 4 x A $PAD_LOOP 1 x U x
          W $PAD_LOOP x
          Z $OUT_ZERO x A $OUT_ZERO 48 x P $OUT_ZERO x
          A $COUNT 1 x
          C $COUNT $CMP x F $CMP 5 x
          Z $OUT_X x A $OUT_X 120 x P $OUT_X x
          Z $COUNT x
          Z $PAD_LOOP x
          U x
          E x
          EOF
          ./meta_compiler < source_self_host_compiler.txt > self_host_compiler.rib
          cat self_host_compiler.rib | ./ribbothon ultimate_aot.rib > self_host_compiler.c
          gcc -O3 self_host_compiler.c -o self_host_compiler.exe
          chmod +x self_host_compiler.exe
          
          echo -e "\n--- Executing Self-Hosted Compiler Foundation ---"
          set +e
          echo -n ">++" | ./self_host_compiler.exe > test_output.txt
          RET=$?
          set -e
          echo "Status: $RET"
          
          echo -e "\n--- Test Output ---"
          cat test_output.txt
