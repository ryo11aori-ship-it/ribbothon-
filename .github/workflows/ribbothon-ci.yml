name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Test Native Binary Emission (ELF Header)
        run: |
          cat << 'EOF' > source_elf_emitter.txt
          Z $OUT x
          
          A $OUT 127 x
          P $OUT x
          Z $OUT x
          
          A $OUT 69 x
          P $OUT x
          Z $OUT x
          
          A $OUT 76 x
          P $OUT x
          Z $OUT x
          
          A $OUT 70 x
          P $OUT x
          Z $OUT x
          
          A $OUT 2 x
          P $OUT x
          Z $OUT x
          
          A $OUT 1 x
          P $OUT x
          Z $OUT x
          
          A $OUT 1 x
          P $OUT x
          Z $OUT x
          EOF
          ./meta_compiler < source_elf_emitter.txt > elf_emitter.rib
          echo -e "\n--- Emitting Raw Binary from pure Ribbothon ---"
          ./ribbothon elf_emitter.rib > output.elf
          
          echo -e "\n--- Hexdump of the Generated Binary ---"
          hexdump -C output.elf
