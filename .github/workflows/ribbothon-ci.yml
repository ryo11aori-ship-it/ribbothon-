name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler1.c -o meta_compiler
          
      - name: Test Meta Compiler Pipeline
        run: |
          echo "99999 99999 99999 99999 9999 . + ." > source.txt
          ./meta_compiler < source.txt > compiled.rib
          echo "--- Compiled Ribbon ---"
          cat compiled.rib
          echo -e "\n--- Execution Result ---"
          cat compiled.rib | ./ribbothon
