name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler4.c -o meta_compiler
          
      - name: Test Absolute Addressing
        run: |
          cat << 'EOF' > source.txt
          @0 99999 99999 99999 99999 99990 x
          @1 99999 99999 99999 99999 99993 x
          @0 . @1 . x
          EOF
          ./meta_compiler < source.txt > compiled.rib
          echo "--- Compiled Ribbon ---"
          cat compiled.rib
          echo -e "\n--- Execution Result ---"
          cat compiled.rib | ./ribbothon
