name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Generate Turing-Complete AOT Compiler (Perfect REX Edition)
        run: |
          cat << 'EOF' > generate.py
          import sys
          
          def emit_bytes(vals, track=True):
              res = ""
              for val in vals:
                  res += f"Z $OUT x A $OUT {val} x P $OUT x\n"
              if track:
                  size = len(vals)
                  res += f"C $CMP $IN_LOOP x F $CMP 1 x A $BODY_SIZE {size} x U x\n"
              return res
          
          elf_bytes = [
              0x7f, 0x45, 0x4c, 0x46, 0x02, 0x01, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x02, 0x00, 0x3e, 0x00, 0x01, 0x00, 0x00, 0x00, 0x78, 0x00, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x00, 0x00, 0x00, 0x40, 0x00, 0x38, 0x00, 0x01, 0x00, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x01, 0x00, 0x00, 0x00, 0x07, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x48, 0x81, 0xec, 0x30, 0x75, 0x00, 0x00,
              0x49, 0x89, 0xe7,
              0x4d, 0x31, 0xf6
          ]
          
          post_code = [
              0xb8, 0x3c, 0x00, 0x00, 0x00,
              0xbf, 0x2a, 0x00, 0x00, 0x00, # exit(42) に戻しました！
              0x0f, 0x05
          ]
          
          with open('source_ultimate_aot.txt', 'w') as f:
              f.write("Z $OUT x Z $IN_LOOP x Z $BODY_SIZE x\n")
              
              for b in elf_bytes:
                  f.write(f"Z $OUT x A $OUT {b} x P $OUT x\n")
              
              f.write("I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x W $EOF_CHECK x\n")
              
              # ポインタ移動 (49)
              f.write("C $CMP $CHAR x F $CMP 49 x\n" + emit_bytes([0x49, 0xFF, 0xC6]) + "U x\n")
              f.write("C $CMP $CHAR x F $CMP 50 x\n" + emit_bytes([0x49, 0xFF, 0xCE]) + "U x\n")
              
              # メモリ操作 (41 -> 43 に修正)
              f.write("C $CMP $CHAR x F $CMP 51 x\n" + emit_bytes([0x43, 0xFE, 0x04, 0x37]) + "U x\n")
              f.write("C $CMP $CHAR x F $CMP 52 x\n" + emit_bytes([0x43, 0xFE, 0x0C, 0x37]) + "U x\n")
              
              # I/Oシステムコール (4F -> 4B に修正)
              f.write("C $CMP $CHAR x F $CMP 53 x\n" + emit_bytes([0xB0, 0x01, 0xBF, 0x01, 0x00, 0x00, 0x00, 0x4B, 0x8D, 0x34, 0x37, 0xB2, 0x01, 0x0F, 0x05]) + "U x\n")
              f.write("C $CMP $CHAR x F $CMP 54 x\n" + emit_bytes([0x30, 0xC0, 0x31, 0xFF, 0x4B, 0x8D, 0x34, 0x37, 0xB2, 0x01, 0x0F, 0x05]) + "U x\n")
              
              # 7: [ (ループ開始 - 41 -> 43 に修正)
              f.write("C $CMP $CHAR x F $CMP 55 x\n")
              f.write("A $IN_LOOP 1 x Z $BODY_SIZE x\n")
              f.write(emit_bytes([0x43, 0x80, 0x3C, 0x37, 0x00, 0x0F, 0x84, 0x75, 0x00, 0x00, 0x00], track=False))
              f.write("U x\n")
              
              # 8: ] (ループ終了とNOPパディング - 41 -> 43 に修正)
              f.write("C $CMP $CHAR x F $CMP 56 x\n")
              f.write("W 1 x C $CMP $BODY_SIZE x F $CMP 106 x E x Z $OUT x A $OUT 144 x P $OUT x A $BODY_SIZE 1 x U x\n")
              f.write(emit_bytes([0x43, 0x80, 0x3C, 0x37, 0x00, 0x0F, 0x85, 0x8B, 0xFF, 0xFF, 0xFF], track=False))
              f.write("Z $IN_LOOP x\n")
              f.write("U x\n")
              
              f.write("I $CHAR x C $CHAR $EOF_CHECK x A $EOF_CHECK 1 x E x\n")
              
              for b in post_code:
                  f.write(f"Z $OUT x A $OUT {b} x P $OUT x\n")
          EOF
          
          python3 generate.py
          ./meta_compiler < source_ultimate_aot.txt > ultimate_aot.rib
          
          echo -e "\n--- Step 1: Writing pure Ribbothon Loop Program 'A' ---"
          # ++++++[>++++++++++<-]>+++++.
          echo -n "3333337133333333332481333335" > my_app.rib
          
          echo -e "\n--- Step 2: Compiling 'my_app.rib' to Native Linux Executable ---"
          cat my_app.rib | ./ribbothon ultimate_aot.rib > my_app.exe
          
          echo -e "\n--- Step 3: Executing the Native Turing-Complete Executable! ---"
          chmod +x my_app.exe
          
          # GitHub Actionsがエラーで止まらないように一時解除
          set +e
          ./my_app.exe > result.txt
          RET=$?
          set -e
          
          echo -e "\n--- Output from Executable ---"
          cat result.txt
          echo ""
          
          echo -e "\n--- OS Return Code (Expected 42) ---"
          echo "Status: $RET"
