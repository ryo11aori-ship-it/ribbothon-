name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Generate Advanced AOT Compiler Source via Python
        run: |
          python3 -c "
          with open('source_ultimate_aot.txt', 'w') as f:
              f.write('Z $OUT x\nZ $PC x\nZ $SP x\n')
              
              f.write('Z $TARGET_VAL x\nZ $TARGET_IDX x\n')
              
              # f-stringを使わず、安全な .format() とエスケープを使う
              for i in range(150):
                  f.write('C $TARGET_IDX $CMP x\nF $CMP {0} x\n  C $TARGET_VAL $BUF_{0} x\nU x\n'.format(i))
              
              f.write('''
              I $CHAR x
              C $CHAR $EOF_CHECK x
              A $EOF_CHECK 1 x
              W $EOF_CHECK x
              
              C $CHAR $CMP x
              F $CMP 51 x
                A $TARGET_VAL 254 x C $PC $TARGET_IDX x
              ''')
              
              for i in range(150):
                  f.write('C $TARGET_IDX $CMP x F $CMP {0} x C $TARGET_VAL $BUF_{0} x U x\n'.format(i))
              
              f.write('''
                A $PC 1 x
                Z $TARGET_VAL x A $TARGET_VAL 7 x C $PC $TARGET_IDX x
              ''')
              
              for i in range(150):
                  f.write('C $TARGET_IDX $CMP x F $CMP {0} x C $TARGET_VAL $BUF_{0} x U x\n'.format(i))
              
              f.write('''
                A $PC 1 x
              U x
              
              I $CHAR x
              C $CHAR $EOF_CHECK x
              A $EOF_CHECK 1 x
              E x
              
              Z $PRINT_IDX x
              W 1 x
              ''')
              
              for i in range(150):
                  f.write('C $PRINT_IDX $CMP x F $CMP {0} x P $BUF_{0} x U x\n'.format(i))
              
              f.write('''
                A $PRINT_IDX 1 x
                C $PRINT_IDX $CMP x
              E x
              ''')
          "
          
          head -n 20 source_ultimate_aot.txt
          echo "..."
          tail -n 20 source_ultimate_aot.txt
