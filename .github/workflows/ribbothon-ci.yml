name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Build Pure Ribbothon Native Compiler
        run: |
          cat << 'EOF' > source_pure_x86.txt
          Z $OUT x
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          W $EOF_CHECK x
          C $CHAR $CMP x
          F $CMP 51 x
          A $OUT 254 x
          P $OUT x
          Z $OUT x
          A $OUT 7 x
          P $OUT x
          Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 52 x
          A $OUT 254 x
          P $OUT x
          Z $OUT x
          A $OUT 15 x
          P $OUT x
          Z $OUT x
          U x
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          E x
          EOF
          ./meta_compiler < source_pure_x86.txt > pure_x86_compiler.rib
          echo -e "\n--- Compiling pure ribbothon '343' to x86 Machine Code ---"
          echo -n "343" | ./ribbothon pure_x86_compiler.rib > output.bin
          hexdump -C output.bin
