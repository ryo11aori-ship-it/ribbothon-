name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler6.c -o meta_compiler
          
      - name: Test Loop and Multiply
        run: |
          cat << 'EOF' > source.txt
          $COUNTER 99 x
          
          W $COUNTER x
            $VAL_H 9999 x
            $VAL_I 9999 x
            $COUNTER - x
          E x
          
          $VAL_I 3 x
          $VAL_H . x
          $VAL_I . x
          EOF
          ./meta_compiler < source.txt > compiled.rib
          echo "--- Compiled Ribbon ---"
          cat compiled.rib
          echo -e "\n--- Execution Result ---"
          cat compiled.rib | ./ribbothon
