name: Ribbothon CI (Strict Self-Hosting)
on: [push,pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Compile Seed (S0)
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
      - name: Setup Void Hardware Environment
        run: |
          sudo apt-get install -y qemu-system-x86
      - name: Build Baremetal AOT Generator (S0-Void)
        run: |
          gcc baremetal_aot_gen.c -o baremetal_aot_gen
      - name: Compile Ribbothon S1 to Baremetal OS
        run: |
          echo "A \$MAIN_LOOP 1 x" > prepend.txt
          cat source_self_host_compiler.txt >> prepend.txt
          mv prepend.txt source_self_host_compiler.txt
          
          cat << 'EOF' > patch_s1.py
          lines = open("source_self_host_compiler.txt").read().splitlines()
          for i in range(len(lines)):
              if lines[i].strip() == "E x" and lines[i-1].strip() == "F $CMP 0 x":
                  lines[i] = "Z $MAIN_LOOP x"
          open("source_self_host_compiler.txt", "w").write("\n".join(lines) + "\n")
          EOF
          python3 patch_s1.py
          
          ./meta_compiler < source_self_host_compiler.txt > s1.rib
          ./baremetal_aot_gen < s1.rib

      - name: Prove The Absolute Void (Strict Self-Hosting S1)
        run: |
          cat << 'EOF' > feed.py
          import sys, time
          time.sleep(2)
          for c in b"+++++":
              sys.stdout.buffer.write(bytes([c]))
              sys.stdout.buffer.flush()
              time.sleep(0.1)
          sys.stdout.buffer.write(b"\xff")
          sys.stdout.buffer.flush()
          time.sleep(10)
          EOF
          python3 feed.py | timeout 15 qemu-system-x86_64 -drive format=raw,file=void_os.img -display none -serial stdio > void_output.txt || true
          echo "Output from VoidOS:"
          cat void_output.txt
          echo ""
          echo "Hexdump of Output:"
          hexdump -C void_output.txt
