name: Ribbothon CI (Strict Self-Hosting)
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Compile Seed (S0)
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
      - name: Setup Void Hardware Environment
        run: |
          sudo apt-get install -y qemu-system-x86
          
      - name: Build Baremetal AOT Generator (S0-Void)
        run: |
          gcc baremetal_aot_gen.c -o baremetal_aot_gen
          
      - name: Compile Ribbothon S1 to Baremetal OS
        run: |
          cat source_self_host_compiler.txt | ./baremetal_aot_gen
          
      - name: Prove The Absolute Void (QEMU Serial Test)
        run: |
          echo -n "Z!A!A!P!S!P!" > test_input.txt
          # OSを起動し、test_input.txtをシリアル(COM1)経由で注入、出力をvoid_output.txtへ記録
          qemu-system-x86_64 -drive format=raw,file=void_os.img \
            -nographic -serial stdio < test_input.txt > void_output.txt
            
          echo "Output from VoidOS:"
          cat void_output.txt

