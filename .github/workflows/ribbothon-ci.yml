name: Ribbothon CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Tools
        run: |
          gcc -O3 ribbothon.c -o ribbothon -lm
          gcc -O3 meta_compiler9.c -o meta_compiler
          
      - name: Build The Ultimate Native Compiler
        run: |
          cat << 'EOF' > source_ultimate_aot.txt
          Z $OUT x
          A $OUT 127 x P $OUT x Z $OUT x
          A $OUT 69 x P $OUT x Z $OUT x
          A $OUT 76 x P $OUT x Z $OUT x
          A $OUT 70 x P $OUT x Z $OUT x
          A $OUT 2 x P $OUT x Z $OUT x
          A $OUT 1 x P $OUT x Z $OUT x
          A $OUT 1 x P $OUT x Z $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 2 x P $OUT x Z $OUT x P $OUT x
          A $OUT 62 x P $OUT x Z $OUT x P $OUT x
          A $OUT 1 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 120 x P $OUT x Z $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x
          A $OUT 56 x P $OUT x Z $OUT x P $OUT x
          A $OUT 1 x P $OUT x Z $OUT x P $OUT x
          A $OUT 64 x P $OUT x Z $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 1 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 5 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x P $OUT x A $OUT 64 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x A $OUT 16 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x A $OUT 16 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          P $OUT x A $OUT 16 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x P $OUT x
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          W $EOF_CHECK x
          C $CHAR $CMP x
          F $CMP 51 x
          A $OUT 254 x P $OUT x Z $OUT x A $OUT 7 x P $OUT x Z $OUT x
          U x
          C $CHAR $CMP x
          F $CMP 52 x
          A $OUT 254 x P $OUT x Z $OUT x A $OUT 15 x P $OUT x Z $OUT x
          U x
          I $CHAR x
          C $CHAR $EOF_CHECK x
          A $EOF_CHECK 1 x
          E x
          A $OUT 184 x P $OUT x Z $OUT x A $OUT 60 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 191 x P $OUT x Z $OUT x A $OUT 42 x P $OUT x Z $OUT x P $OUT x P $OUT x P $OUT x
          A $OUT 15 x P $OUT x Z $OUT x A $OUT 5 x P $OUT x Z $OUT x
          EOF
          ./meta_compiler < source_ultimate_aot.txt > ultimate_aot.rib
          
          echo -e "\n--- Step 1: Writing pure Ribbothon program '3343' ---"
          echo -n "3343" > my_app.rib
          
          echo -e "\n--- Step 2: Compiling 'my_app.rib' to Native Linux Executable using Ultimate AOT Compiler ---"
          cat my_app.rib | ./ribbothon ultimate_aot.rib > my_app.exe
          
          echo -e "\n--- Hexdump of Generated Native Executable (my_app.exe) ---"
          hexdump -C my_app.exe
          
          echo -e "\n--- Step 3: Executing the Native Executable Directly! ---"
          chmod +x my_app.exe
          set +e
          ./my_app.exe
          RET=$?
          set -e
          
          echo -e "\n--- OS Return Code (Expected 42) ---"
          echo "Status: $RET"
